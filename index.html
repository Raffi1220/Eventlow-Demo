<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventlow Demo</title><style>body{margin:0;font:15px system-ui;background:#f2f5fa;color:#17243b}header{background:#142b4c;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 5%;background:white}button{border:0;border-radius:9px;padding:11px 14px;background:#245cba;color:white;cursor:pointer}nav button{background:#e8effa;color:#193c71}nav button.active{background:#245cba;color:white}main{max-width:1050px;margin:25px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 10px #20345110;margin-bottom:16px}h1{font-size:26px}h2{font-size:19px}strong.num{font-size:30px;display:block;margin-top:8px}input,select,textarea{padding:12px;border:1px solid #cbd5e1;border-radius:8px;width:100%;box-sizing:border-box;margin:7px 0 14px}label{display:block;font-weight:600}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #edf0f5}.muted{color:#63748c}.tag{background:#e9f2ff;color:#245cba;border-radius:30px;padding:5px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#e3f5eb;color:#165a38;min-height:50px;padding:8px 3px}.booked{background:#fce5e5;color:#a12626}.pending{background:#fff1d4;color:#855300}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}@media(max-width:500px){header{padding:14px}nav{padding:12px}nav button{flex:1 1 40%}.grid{gap:3px}.day{font-size:12px;min-height:42px;padding:4px 1px}}footer{text-align:center;color:#718096;padding:25px}</style><header><b>✦ Eventlow <span style="font-weight:400">| Business Suite</span></b><span>Interaktive Demo</span></header><nav id="nav"></nav><main id="app"></main><footer>Demo mit Beispieldaten · Keine echten Buchungen oder Videokonferenzen · Speicherung nur im Browser</footer><script>
const tabs=['Übersicht','Kalender','Buchungen','Kunden','Aufgaben','Videotermine','Kundenportal'];let page='Übersicht';const seed=[{id:1,name:'Musterfirma GmbH',date:'2026-11-19',type:'Firmenveranstaltung',status:'Bestätigt'},{id:2,name:'Anna Berger',date:'2026-11-23',type:'Beratung',status:'Anfrage'},{id:3,name:'Thomas Huber',date:'2026-11-27',type:'Eventplanung',status:'Bestätigt'}];let bookings=JSON.parse(localStorage.getItem('eventlow_bookings')||'null')||seed;let tasks=JSON.parse(localStorage.getItem('eventlow_tasks')||'null')||[{name:'Angebot für Musterfirma erstellen',done:false},{name:'Rückmeldung an Anna Berger',done:false},{name:'Unterlagen für Veranstaltung prüfen',done:true}];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem('eventlow_bookings',JSON.stringify(bookings));localStorage.setItem('eventlow_tasks',JSON.stringify(tasks))};const card=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';const listing=b=>'<div class="row"><div><b>'+esc(b.name)+'</b><div class="muted">'+esc(b.type)+' · '+esc(b.date)+'</div></div><span class="tag">'+esc(b.status)+'</span></div>';function render(){document.getElementById('nav').innerHTML=tabs.map(t=>'<button class="'+(t===page?'active':'')+'" onclick="go(\''+t+'\')">'+t+'</button>').join('');let a='<h1>'+page+'</h1>';if(page==='Übersicht'){a+='<div class="cards">'+[['Buchungen',bookings.filter(x=>x.status==='Bestätigt').length],['Offene Anfragen',bookings.filter(x=>x.status==='Anfrage').length],['Kunden',new Set(bookings.map(x=>x.name)).size],['Offene Aufgaben',tasks.filter(x=>!x.done).length]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><strong class="num">'+x[1]+'</strong></div>').join('')+'</div>'+card('Aktuelle Buchungen',bookings.slice(-5).map(listing).join(''))+card('Deine Arbeitszentrale','<p>Alle Kunden, Termine, Buchungen, Aufgaben und Videogespräche an einem Ort.</p><button onclick="go(\'Kundenportal\')">Kundenbuchung demonstrieren</button>')}if(page==='Kalender'){let days=['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>'<b style="text-align:center">'+x+'</b>').join('');let off=6;a+=card('November 2026 · Grün = frei · Rot = gebucht · Gelb = Anfrage','<div class="grid">'+days+Array(off).fill('<span></span>').join('')+Array.from({length:30},(_,i)=>{let d=i+1,bs=bookings.filter(x=>x.date==='2026-11-'+String(d).padStart(2,'0')),cls=bs.some(x=>x.status==='Bestätigt')?'booked':bs.length?'pending':'';return '<button class="day '+cls+'" onclick="alert(\''+(bs.length?bs.map(x=>x.name+' – '+x.status).join(', '):'Noch keine Buchung') .replace(/'/g,'')+'\')">'+d+'</button>'}).join('')+'</div>')}if(page==='Buchungen'){a+=card('Buchungsanfragen und bestätigte Termine',bookings.map(b=>listing(b)+(b.status==='Anfrage'?'<button onclick="confirmBooking('+b.id+')">Bestätigen</button>':'')).join(''))}if(page==='Kunden'){a+=card('Kundenübersicht',[...new Set(bookings.map(x=>x.name))].map(n=>'<div class="row"><b>'+esc(n)+'</b><span class="muted">'+bookings.filter(x=>x.name===n).length+' Vorgang/Vorgänge</span></div>').join(''))}if(page==='Aufgaben'){a+=card('To-dos',tasks.map((t,i)=>'<div class="row"><label><input style="width:auto;margin-right:8px" type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTask('+i+')">'+esc(t.name)+'</label></div>').join('')+'<form onsubmit="addTask(event)"><label>Neue Aufgabe</label><input name="task" required placeholder="Aufgabe eingeben"><button>Hinzufügen</button></form>')}if(page==='Videotermine'){a+=card('Videoberatung','<p>Hier könnten Zoom- oder andere Videokonferenzen direkt aus einer Kundenbuchung heraus geplant und gestartet werden.</p><p class="muted">In dieser Demo ist noch kein Videodienst verbunden.</p>')}if(page==='Kundenportal'){a+=card('Termin anfragen','<p>So könnte ein Kunde online eine Buchungsanfrage stellen.</p><form onsubmit="book(event)"><label>Name</label><input name="name" required placeholder="Vor- und Nachname"><label>Wunschtermin</label><input name="date" type="date" min="2026-11-01" required><label>Leistung</label><select name="type"><option>Eventplanung</option><option>Beratung</option><option>Videoberatung</option><option>Veranstaltungsanfrage</option></select><button>Buchungsanfrage senden</button></form>')+card('So funktioniert es','1. Kunde stellt Anfrage<br>2. Unternehmer sieht die Anfrage unter „Buchungen“<br>3. Unternehmer bestätigt sie<br>4. Der Kalender zeigt den Termin als belegt')}document.getElementById('app').innerHTML=a}function go(p){page=p;render();scrollTo(0,0)}function confirmBooking(id){let b=bookings.find(x=>x.id===id);if(bookings.some(x=>x.id!==id&&x.date===b.date&&x.status==='Bestätigt'))return alert('Dieser Tag ist bereits belegt.');b.status='Bestätigt';save();render()}function book(e){e.preventDefault();let f=new FormData(e.target);bookings.push({id:Date.now(),name:f.get('name'),date:f.get('date'),type:f.get('type'),status:'Anfrage'});save();alert('Demo-Anfrage erfasst. Wechsle zu Buchungen.');go('Buchungen')}function toggleTask(i){tasks[i].done=!tasks[i].done;save();render()}function addTask(e){e.preventDefault();tasks.push({name:new FormData(e.target).get('task'),done:false});save();render()}render();
</script></html>
